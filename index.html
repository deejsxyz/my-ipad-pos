<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kapampangan Bistro POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased select-none">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      function App() {
        const [view, setView] = useState("register");
        const [activeCategory, setActiveCategory] = useState("All");
        const [cart, setCart] = useState([]);
        const [selectedCartIndex, setSelectedCartIndex] = useState(null);
        const [showDiscountModal, setShowDiscountModal] = useState(false);
        const [showCheckoutModal, setShowCheckoutModal] = useState(false);
        const [discountType, setDiscountType] = useState("PWD");
        const [idHolderName, setIdHolderName] = useState("");
        const [idNumber, setIdNumber] = useState("");
        const [lastReceipt, setLastReceipt] = useState(null);

        const categories = ["All", "Sizzling", "Mains", "Noodles", "Drinks"];
        const items = [
          { id: 1, name: "Sisig Kapampangan", price: 250, category: "Sizzling" },
          { id: 2, name: "Sinigang na Baboy", price: 280, category: "Mains" },
          { id: 3, name: "Chicken Adobo", price: 220, category: "Mains" },
          { id: 4, name: "Pansit Palabok", price: 160, category: "Noodles" },
          { id: 5, name: "Tokwa't Baboy", price: 140, category: "Sizzling" },
          { id: 6, name: "House Iced Tea", price: 60, category: "Drinks" }
        ];

        const addToCart = (item) => {
          setCart(prev => {
            const existing = prev.find(i => i.id === item.id && !i.discountType);
            if (existing) {
              return prev.map(i => i === existing ? { ...i, qty: i.qty + 1 } : i);
            }
            return [...prev, { ...item, qty: 1, discountType: null, idHolderName: "", idNumber: "" }];
          });
        };

        const applyDiscount = () => {
          if (selectedCartIndex === null) return;
          setCart(prev => prev.map((item, idx) => {
            if (idx === selectedCartIndex) {
              return { ...item, discountType, idHolderName, idNumber };
            }
            return item;
          }));
          setShowDiscountModal(false);
        };

        const calculateTotals = () => {
          let grossSales = 0;
          let discountTotal = 0;
          let vatExemptSales = 0;

          cart.forEach(item => {
            const lineGross = item.price * item.qty;
            grossSales += lineGross;
            if (item.discountType) {
              const lineDisc = lineGross * 0.20;
              discountTotal += lineDisc;
              vatExemptSales += lineGross;
            }
          });

          const totalDue = grossSales - discountTotal;
          return { grossSales, discountTotal, vatExemptSales, totalDue };
        };

        const { grossSales, discountTotal, vatExemptSales, totalDue } = calculateTotals();

        const handleCheckout = (method) => {
          const receipt = {
            orNo: "OR-" + Math.floor(100000 + Math.random() * 900000),
            date: new Date().toLocaleString(),
            items: [...cart],
            grossSales,
            discountTotal,
            vatExemptSales,
            totalDue,
            method
          };
          setLastReceipt(receipt);
          setCart([]);
          setShowCheckoutModal(false);
        };

        return (
          <div className="flex h-screen w-screen overflow-hidden bg-slate-900 text-slate-100">
            {/* Sidebar */}
            <aside className="w-20 bg-slate-950 flex flex-col items-center py-6 space-y-8 border-r border-slate-800">
              <div className="w-12 h-12 bg-emerald-600 rounded-2xl flex items-center justify-center font-bold text-xl shadow-lg shadow-emerald-900/50">
                KB
              </div>
              <nav className="flex flex-col space-y-4 w-full px-3">
                {[
                  { id: "register", label: "POS" },
                  { id: "transactions", label: "Orders" },
                  { id: "drawer", label: "Cash" },
                  { id: "reports", label: "BIR Z" }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setView(tab.id)}
                    className={`flex flex-col items-center justify-center py-3 rounded-xl transition-all ${
                      view === tab.id ? "bg-emerald-600 text-white shadow-lg" : "text-slate-400 hover:bg-slate-800"
                    }`}
                  >
                    <span className="text-xs font-bold">{tab.label}</span>
                  </button>
                ))}
              </nav>
            </aside>

            {/* Main Area */}
            {view === "register" ? (
              <div className="flex flex-1 overflow-hidden">
                {/* Product Catalog */}
                <div className="flex-1 flex flex-col p-6 overflow-hidden">
                  <header className="flex items-center justify-between pb-6 border-b border-slate-800">
                    <div>
                      <h1 className="text-2xl font-bold text-white">Kapampangan Bistro</h1>
                      <p className="text-xs text-slate-400 font-mono">NON-VAT REG TIN: 000-123-456-000</p>
                    </div>
                    <span className="px-3 py-1 bg-emerald-500/10 text-emerald-400 text-xs rounded-full border border-emerald-500/20 font-mono">
                      POS Terminal #1
                    </span>
                  </header>

                  {/* Categories */}
                  <div className="flex space-x-2 my-4 overflow-x-auto pb-2">
                    {categories.map(cat => (
                      <button
                        key={cat}
                        onClick={() => setActiveCategory(cat)}
                        className={`px-5 py-2.5 rounded-xl text-sm font-medium whitespace-nowrap transition-all ${
                          activeCategory === cat ? "bg-emerald-600 text-white shadow-lg" : "bg-slate-800 text-slate-300 hover:bg-slate-700"
                        }`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>

                  {/* Grid */}
                  <div className="grid grid-cols-3 gap-4 overflow-y-auto pr-2 flex-1">
                    {items
                      .filter(i => activeCategory === "All" || i.category === activeCategory)
                      .map(item => (
                        <button
                          key={item.id}
                          onClick={() => addToCart(item)}
                          className="bg-slate-800 hover:bg-slate-750 p-4 rounded-2xl flex flex-col justify-between text-left border border-slate-700/50 transition-all active:scale-95 hover:border-slate-600 shadow-sm"
                        >
                          <div>
                            <span className="text-xs text-slate-400">{item.category}</span>
                            <h3 className="font-semibold text-white mt-1">{item.name}</h3>
                          </div>
                          <p className="text-lg font-bold text-emerald-400 mt-4">₱{item.price.toFixed(2)}</p>
                        </button>
                      ))}
                  </div>
                </div>

                {/* Cart Side Panel */}
                <div className="w-96 bg-slate-950 border-l border-slate-800 flex flex-col justify-between p-6">
                  <div>
                    <h2 className="text-xl font-bold text-white mb-4">Current Order</h2>
                    <div className="space-y-3 max-h-[420px] overflow-y-auto pr-1">
                      {cart.length === 0 ? (
                        <p className="text-slate-500 text-center py-12 text-sm">No items in cart</p>
                      ) : (
                        cart.map((item, idx) => (
                          <div
                            key={idx}
                            onClick={() => {
                              setSelectedCartIndex(idx);
                              setDiscountType(item.discountType || "PWD");
                              setIdHolderName(item.idHolderName || "");
                              setIdNumber(item.idNumber || "");
                              setShowDiscountModal(true);
                            }}
                            className="bg-slate-900 p-3.5 rounded-xl border border-slate-800 hover:border-emerald-500/50 cursor-pointer transition-all"
                          >
                            <div className="flex justify-between items-start">
                              <div>
                                <h4 className="font-medium text-slate-200 text-sm">{item.name}</h4>
                                {item.discountType && (
                                  <span className="inline-block mt-1 text-[10px] bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded font-semibold">
                                    -20% {item.discountType}
                                  </span>
                                )}
                              </div>
                              <span className="font-bold text-slate-200 text-sm">₱{(item.price * item.qty).toFixed(2)}</span>
                            </div>
                            <div className="flex items-center justify-between mt-3 text-xs text-slate-400">
                              <span>Qty: {item.qty}</span>
                              <span className="text-emerald-400 text-[11px]">Click to modify / discount</span>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>

                  {/* Cart Footer */}
                  <div className="border-t border-slate-800 pt-4 space-y-2">
                    <div className="flex justify-between text-slate-400 text-sm">
                      <span>Gross Sales</span>
                      <span>₱{grossSales.toFixed(2)}</span>
                    </div>
                    {discountTotal > 0 && (
                      <div className="flex justify-between text-amber-400 text-sm">
                        <span>Govt Discount (-20%)</span>
                        <span>-₱{discountTotal.toFixed(2)}</span>
                      </div>
                    )}
                    <div className="flex justify-between text-white font-bold text-xl pt-2 border-t border-slate-800">
                      <span>Total Due</span>
                      <span className="text-emerald-400">₱{totalDue.toFixed(2)}</span>
                    </div>
                    <button
                      disabled={cart.length === 0}
                      onClick={() => setShowCheckoutModal(true)}
                      className="w-full mt-4 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-800 disabled:text-slate-600 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-98"
                    >
                      Checkout (₱{totalDue.toFixed(2)})
                    </button>
                  </div>
                </div>
              </div>
            ) : (
              <div className="flex-1 p-8 overflow-y-auto">
                <h1 className="text-2xl font-bold mb-2 capitalize">{view} View</h1>
                <p className="text-slate-400">BIR RMO 24-2023 Terminal status operational.</p>
              </div>
            )}

            {/* Discount Modal */}
            {showDiscountModal && selectedCartIndex !== null && (
              <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4">
                  <h3 className="text-lg font-bold text-white">Apply Government Discount</h3>
                  <div>
                    <label className="text-xs text-slate-400 block mb-2">Discount Type</label>
                    <div className="grid grid-cols-3 gap-2">
                      {["PWD", "SC", "SP", "NAAC", "MOV", "OTHERS"].map(type => (
                        <button
                          key={type}
                          onClick={() => setDiscountType(type)}
                          className={`py-2 text-xs font-bold rounded-lg transition-all ${
                            discountType === type ? "bg-emerald-600 text-white" : "bg-slate-800 text-slate-300"
                          }`}
                        >
                          {type}
                        </button>
                      ))}
                    </div>
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">ID Holder Name</label>
                    <input
                      type="text"
                      placeholder="e.g. Juan Cruz"
                      value={idHolderName}
                      onChange={e => setIdHolderName(e.target.value)}
                      className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">ID Number</label>
                    <input
                      type="text"
                      placeholder="e.g. PWD-123456"
                      value={idNumber}
                      onChange={e => setIdNumber(e.target.value)}
                      className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                  <div className="flex space-x-3 pt-2">
                    <button
                      onClick={() => setShowDiscountModal(false)}
                      className="flex-1 bg-slate-800 hover:bg-slate-700 py-2.5 rounded-xl text-slate-300 font-medium text-sm"
                    >
                      Cancel
                    </button>
                    <button
                      onClick={applyDiscount}
                      className="flex-1 bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded-xl text-white font-bold text-sm shadow-lg shadow-emerald-600/30"
                    >
                      Apply Discount
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Checkout Modal */}
            {showCheckoutModal && (
              <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-6 space-y-4 text-center">
                  <h3 className="text-xl font-bold text-white">Select Payment Method</h3>
                  <p className="text-slate-400 text-sm">Total Due: <span className="text-emerald-400 font-bold">₱{totalDue.toFixed(2)}</span></p>
                  <div className="space-y-2 pt-2">
                    {["Cash", "GCash", "Maya", "Card"].map(method => (
                      <button
                        key={method}
                        onClick={() => handleCheckout(method)}
                        className="w-full py-3.5 bg-slate-800 hover:bg-emerald-600 text-white font-semibold rounded-xl transition-all"
                      >
                        {method}
                      </button>
                    ))}
                  </div>
                  <button
                    onClick={() => setShowCheckoutModal(false)}
                    className="w-full py-2 text-slate-500 hover:text-slate-300 text-sm"
                  >
                    Back to Order
                  </button>
                </div>
              </div>
            )}

            {/* Thermal Receipt Preview Modal */}
            {lastReceipt && (
              <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
                <div className="bg-white text-black p-6 rounded-2xl max-w-sm w-full font-mono text-xs space-y-3 shadow-2xl">
                  <div className="text-center space-y-1">
                    <h2 className="text-base font-bold">KAPAMPANGAN BISTRO</h2>
                    <p className="text-[10px]">NON-VAT REGISTERED</p>
                    <p className="text-[10px]">TIN: 000-123-456-000</p>
                  </div>
                  <div className="text-left border-t border-b border-dashed py-2 space-y-0.5 text-[11px]">
                    <div>Date/Time: {lastReceipt.date}</div>
                    <div>Receipt No / OR: {lastReceipt.orNo}</div>
                    <div>POS Terminal #: 01</div>
                  </div>
                  <div className="space-y-1">
                    {lastReceipt.items.map((it, idx) => (
                      <div key={idx} className="flex justify-between">
                        <span>{it.qty}x {it.name} {it.discountType ? `(-20% ${it.discountType})` : ""}</span>
                        <span>₱{(it.price * it.qty).toFixed(2)}</span>
                      </div>
                    ))}
                  </div>
                  <div className="border-t border-dashed pt-2 space-y-1">
                    <div className="flex justify-between">
                      <span>Gross Sales</span>
                      <span>₱{lastReceipt.grossSales.toFixed(2)}</span>
                    </div>
                    {lastReceipt.discountTotal > 0 && (
                      <div className="flex justify-between">
                        <span>Discount</span>
                        <span>-₱{lastReceipt.discountTotal.toFixed(2)}</span>
                      </div>
                    )}
                    <div className="flex justify-between">
                      <span>VAT Exempt Sales</span>
                      <span>₱{lastReceipt.vatExemptSales.toFixed(2)}</span>
                    </div>
                    <div className="flex justify-between font-bold text-sm pt-1 border-t">
                      <span>Total Due</span>
                      <span>₱{lastReceipt.totalDue.toFixed(2)}</span>
                    </div>
                  </div>
                  <div className="pt-1">
                    <p className="font-bold">Payment Method: {lastReceipt.method}</p>
                  </div>
                  {lastReceipt.items.some(i => i.discountType) && (
                    <div className="pt-2 border-t text-[10px] space-y-0.5">
                      <p className="font-bold">DISCOUNT DETAILS:</p>
                      {lastReceipt.items.filter(i => i.discountType).map((it, idx) => (
                        <p key={idx}>{it.discountType} | Name: {it.idHolderName || 'N/A'} | ID: {it.idNumber || 'N/A'}</p>
                      ))}
                    </div>
                  )}
                  <div className="text-center pt-3 text-[9px] text-gray-500 border-t border-dashed">
                    <p>THIS DOCUMENT IS NOT VALID</p>
                    <p>FOR CLAIM OF INPUT TAX</p>
                  </div>
                  <button
                    onClick={() => setLastReceipt(null)}
                    className="w-full mt-4 bg-black text-white py-3 rounded-lg font-sans font-bold text-xs"
                  >
                    Close & Start New Order
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
