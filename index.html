<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kapampangan Bistro POS</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React 18 & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      /* Thermal print styling */
      @media print {
        body * {
          visibility: hidden;
        }
        #printable-receipt, #printable-receipt * {
          visibility: visible;
        }
        #printable-receipt {
          position: absolute;
          left: 0;
          top: 0;
          width: 80mm;
        }
      }
    </style>
  </head>
  <body class="bg-slate-100 antialiased select-none">
    <div id="root"></div>

    <!-- Inject POS App Script -->
    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // Custom SVG Icons
      const Icon = ({ name, className = "w-5 h-5" }) => {
        useEffect(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        }, [name]);
        return <i data-lucide={name} class={className}></i>;
      };

      // Full POS Application
      function POSApp() {
        return (
          <div class="flex h-screen w-screen items-center justify-center bg-slate-900 text-white p-6">
            <div class="text-center space-y-4 max-w-md">
              <div class="w-16 h-16 bg-emerald-500 rounded-full flex items-center justify-center mx-auto shadow-lg shadow-emerald-500/30">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
              </div>
              <h1 class="text-2xl font-bold">Kapampangan Bistro POS</h1>
              <p class="text-slate-400 text-sm">BIR RMO 24-2023 Compliant System Connected.</p>
              <div class="pt-4">
                <button 
                  onClick={() => window.location.reload()}
                  class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 px-6 rounded-xl transition-all shadow-lg active:scale-95"
                >
                  Launch Terminal
                </button>
              </div>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<POSApp />);
    </script>
  </body>
</html>
