<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kapampangan Bistro POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-slate-100 antialiased select-none">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // Inline SVG Icons
      const Icon = ({ name, className = "w-5 h-5" }) => {
        const icons = {
          shopping: <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4H6zM3 6h18M16 10a4 4 0 01-8 0" />,
          receipt: <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1zM8 6h8M8 10h8M8 14h4" />,
          drawer: <path d="M3 6h18M3 12h18M3 18h18M7 9h.01M7 15h.01" />,
          box: <path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z" />,
          reports: <path d="M18 20V10M12 20V4M6 20v-6" />,
          settings: <path d="M12 15a3 3 0 100-6 3 3 0 000 6zM19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" />,
          plus: <path d="M12 5v14M5 12h14" />,
          minus: <path d="M5 12h14" />,
          trash: <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" />,
          check: <path d="M20 6L9 17l-5-5" />,
          lock: <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
        };

        return (
          <svg class={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
            {icons[name] || icons.box}
          </svg>
        );
      };

      function MainPOS() {
        const [view, setView] = useState("register");
        const [categories] = useState(["All", "Sizzling", "Mains", "Noodles", "Drinks"]);
        const [activeCategory, setActiveCategory] = useState("All");
        const [cart, setCart] = useState([]);
        const [selectedCartIndex, setSelectedCartIndex] = useState(null);
        const [showDiscountModal, setShowDiscountModal] = useState(false);
        const [showCheckoutModal, setShowCheckoutModal] = useState(false);
        const [discountType, setDiscountType] = useState("PWD");
        const [idHolderName, setIdHolderName] = useState("");
        const [idNumber, setIdNumber] = useState("");
        const [lastReceipt, setLastReceipt] = useState(null);

        const [items] = useState([
          { id: 1, name: "Sisig Kapampangan", price: 250, category: "Sizzling" },
          { id: 2, name: "Sinigang na Baboy", price: 280, category: "Mains" },
          { id: 3, name: "Chicken Adobo", price: 220, category: "Mains" },
          { id: 4, name: "Pansit Palabok", price: 160, category: "Noodles" },
          { id: 5, name: "Tokwa't Baboy", price: 140, category: "Sizzling" },
          { id: 6, name: "House Iced Tea", price: 60, category: "Drinks" }
        ]);

        const addToCart = (item) => {
          setCart(prev => {
            const existing = prev.find(i => i.id === item.id && !i.discountType);
            if (existing) {
              return prev.map(i => i === existing ? { ...i, qty: i.qty + 1 } : i);
            }
            return [...prev, { ...item, qty: 1, discountType: null, idHolderName: "", idNumber: "" }];
          });
        };

        const applyDiscount = () => {
          if (selectedCartIndex === null) return;
          setCart(prev => prev.map((item, idx) => {
            if (idx === selectedCartIndex) {
              return {
                ...item,
                discountType,
                idHolderName,
                idNumber
              };
            }
            return item;
          }));
          setShowDiscountModal(false);
        };

        const calculateTotals = () => {
          let grossSales = 0;
          let discountTotal = 0;
          let vatExemptSales = 0;

          cart.forEach(item => {
            const lineGross = item.price * item.qty;
            grossSales += lineGross;

            if (item.discountType) {
              const lineDisc = lineGross * 0.20;
              discountTotal += lineDisc;
              vatExemptSales += lineGross;
            }
          });

          const totalDue = grossSales - discountTotal;

          return { grossSales, discountTotal, vatExemptSales, totalDue };
        };

        const { grossSales, discountTotal, vatExemptSales, totalDue } = calculateTotals();

        const handleCheckout = (method) => {
          const receipt = {
            orNo: "OR-" + Math.floor(100000 + Math.random() * 900000),
            date: new Date().toLocaleString(),
            items: [...cart],
            grossSales,
            discountTotal,
            vatExemptSales,
            totalDue,
            method
          };
          setLastReceipt(receipt);
          setCart([]);
          setShowCheckoutModal(false);
        };

        return (
          <div class="flex h-screen w-screen overflow-hidden bg-slate-900 text-slate-100">
            {/* Sidebar Navigation */}
            <aside class="w-20 bg-slate-950 flex flex-col items-center py-6 space-y-8 border-r border-slate-800">
              <div class="w-12 h-12 bg-emerald-600 rounded-2xl flex items-center justify-center font-bold text-xl shadow-lg shadow-emerald-900/50">
                KB
              </div>
              <nav class="flex flex-col space-y-4 w-full px-3">
                {[
                  { id: "register", icon: "shopping", label: "POS" },
                  { id: "transactions", icon: "receipt", label: "Orders" },
                  { id: "drawer", icon: "drawer", label: "Cash" },
                  { id: "reports", icon: "reports", label: "BIR Z" }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setView(tab.id)}
                    class={`flex flex-col items-center justify-center py-3 rounded-xl transition-all ${
                      view === tab.id ? "bg-emerald-600 text-white shadow-lg shadow-emerald-600/30" : "text-slate-400 hover:bg-slate-800"
                    }`}
                  >
                    <Icon name={tab.icon} className="w-6 h-6" />
                    <span class="text-[10px] mt-1 font-medium">{tab.label}</span>
                  </button>
                ))}
              </nav>
            </aside>

            {/* Main Area */}
            {view === "register" ? (
              <div class="flex flex-1 overflow-hidden">
                {/* Catalog */}
                <div class="flex-1 flex flex-col p-6 overflow-hidden">
                  <header class="flex items-center justify-between pb-6 border-b border-slate-800">
                    <div>
                      <h1 class="text-2xl font-bold text-white">Kapampangan Bistro</h1>
                      <p class="text-xs text-slate-400 font-mono">NON-VAT REG TIN: 000-123-456-000</p>
                    </div>
                    <span class="px-3 py-1 bg-emerald-500/10 text-emerald-400 text-xs rounded-full border border-emerald-500/20 font-mono">
                      POS Terminal #1 Active
                    </span>
                  </header>

                  {/* Categories */}
                  <div class="flex space-x-2 my-4 overflow-x-auto pb-2">
                    {categories.map(cat => (
                      <button
                        key={cat}
                        onClick={() => setActiveCategory(cat)}
                        class={`px-5 py-2.5 rounded-xl text-sm font-medium whitespace-nowrap transition-all ${
                          activeCategory === cat ? "bg-emerald-600 text-white shadow-lg shadow-emerald-600/20" : "bg-slate-800 text-slate-300 hover:bg-slate-700"
                        }`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>

                  {/* Product Grid */}
                  <div class="grid grid-cols-3 gap-4 overflow-y-auto pr-2 flex-1">
                    {items
                      .filter(i => activeCategory === "All" || i.category === activeCategory)
                      .map(item => (
                        <button
                          key={item.id}
                          onClick={() => addToCart(item)}
                          class="bg-slate-800 hover:bg-slate-750 p-4 rounded-2xl flex flex-col justify-between text-left border border-slate-700/50 transition-all active:scale-95 hover:border-slate-600 shadow-sm group"
                        >
                          <div>
                            <span class="text-xs text-slate-400">{item.category}</span>
                            <h3 class="font-semibold text-white group-hover:text-emerald-400 transition-colors">{item.name}</h3>
                          </div>
                          <p class="text-lg font-bold text-emerald-400 mt-4">₱{item.price.toFixed(2)}</p>
                        </button>
                      ))}
                  </div>
                </div>

                {/* Cart Panel */}
                <div class="w-96 bg-slate-950 border-l border-slate-800 flex flex-col justify-between p-6">
                  <div>
                    <h2 class="text-xl font-bold text-white mb-4">Current Order</h2>
                    <div class="space-y-3 max-h-[420px] overflow-y-auto pr-1">
                      {cart.length === 0 ? (
                        <p class="text-slate-500 text-center py-12 text-sm">No items in cart</p>
                      ) : (
                        cart.map((item, idx) => (
                          <div
                            key={idx}
                            onClick={() => {
                              setSelectedCartIndex(idx);
                              setDiscountType(item.discountType || "PWD");
                              setIdHolderName(item.idHolderName || "");
                              setIdNumber(item.idNumber || "");
                              setShowDiscountModal(true);
                            }}
                            class="bg-slate-900 p-3.5 rounded-xl border border-slate-800 hover:border-emerald-500/50 cursor-pointer transition-all"
                          >
                            <div class="flex justify-between items-start">
                              <div>
                                <h4 class="font-medium text-slate-200 text-sm">{item.name}</h4>
                                {item.discountType && (
                                  <span class="inline-block mt-1 text-[10px] bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded font-semibold">
                                    -20% {item.discountType}
                                  </span>
                                )}
                              </div>
                              <span class="font-bold text-slate-200 text-sm">₱{(item.price * item.qty).toFixed(2)}</span>
                            </div>
                            <div class="flex items-center justify-between mt-3 text-xs text-slate-400">
                              <span>Qty: {item.qty}</span>
                              <span class="text-emerald-400 text-[11px]">Click to modify / discount</span>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>

                  {/* Summary & Checkout */}
                  <div class="border-t border-slate-800 pt-4 space-y-2">
                    <div class="flex justify-between text-slate-400 text-sm">
                      <span>Gross Sales</span>
                      <span>₱{grossSales.toFixed(2)}</span>
                    </div>
                    {discountTotal > 0 && (
                      <div class="flex justify-between text-amber-400 text-sm">
                        <span>Govt Discount (-20%)</span>
                        <span>-₱{discountTotal.toFixed(2)}</span>
                      </div>
                    )}
                    <div class="flex justify-between text-white font-bold text-xl pt-2 border-t border-slate-800">
                      <span>Total Due</span>
                      <span class="text-emerald-400">₱{totalDue.toFixed(2)}</span>
                    </div>
                    <button
                      disabled={cart.length === 0}
                      onClick={() => setShowCheckoutModal(true)}
                      class="w-full mt-4 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-800 disabled:text-slate-600 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-98"
                    >
                      Checkout (₱{totalDue.toFixed(2)})
                    </button>
                  </div>
                </div>
              </div>
            ) : (
              <div class="flex-1 p-8 overflow-y-auto">
                <h1 class="text-2xl font-bold mb-4 capitalize">{view} View</h1>
                <p class="text-slate-400">Terminal interface running smoothly in BIR compliance mode.</p>
              </div>
            )}

            {/* Discount Modal */}
            {showDiscountModal && selectedCartIndex !== null && (
              <div class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4">
                  <h3 class="text-lg font-bold text-white">Item Discount & Modification</h3>
                  <div>
                    <label class="text-xs text-slate-400 block mb-2">Discount Type</label>
                    <div class="grid grid-cols-3 gap-2">
                      {["PWD", "SC", "SP", "NAAC", "MOV", "OTHERS"].map(type => (
                        <button
                          key={type}
                          onClick={() => setDiscountType(type)}
                          class={`py-2 text-xs font-bold rounded-lg transition-all ${
                            discountType === type ? "bg-emerald-600 text-white" : "bg-slate-800 text-slate-300"
                          }`}
                        >
                          {type}
                        </button>
                      ))}
                    </div>
                  </div>
                  <div>
                    <label class="text-xs text-slate-400 block mb-1">ID Holder Name</label>
                    <input
                      type="text"
                      placeholder="e.g. Juan Cruz"
                      value={idHolderName}
                      onChange={e => setIdHolderName(e.target.value)}
                      class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                  <div>
                    <label class="text-xs text-slate-400 block mb-1">ID Number</label>
                    <input
                      type="text"
                      placeholder="e.g. PWD-123456"
                      value={idNumber}
                      onChange={e => setIdNumber(e.target.value)}
                      class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                  <div class="flex space-x-3 pt-2">
                    <button
                      onClick={() => setShowDiscountModal(false)}
                      class="flex-1 bg-slate-800 hover:bg-slate-700 py-2.5 rounded-xl text-slate-300 font-medium text-sm"
                    >
                      Cancel
                    </button>
                    <button
                      onClick={applyDiscount}
                      class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded-xl text-white font-bold text-sm shadow-lg shadow-emerald-600/30"
                    >
                      Apply Discount
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Checkout Modal */}
            {showCheckoutModal && (
              <div class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-6 space-y-4 text-center">
                  <h3 class="text-xl font-bold text-white">Select Payment Method</h3>
                  <p class="text-slate-400 text-sm">Total Due: <span class="text-emerald-400 font-bold">₱{totalDue.toFixed(2)}</span></p>
                  <div class="space-y-2 pt-2">
                    {["Cash", "GCash", "Maya", "Card"].map(method => (
                      <button
                        key={method}
                        onClick={() => handleCheckout(method)}
                        class="w-full py-3.5 bg-slate-800 hover:bg-emerald-600 text-white font-semibold rounded-xl transition-all"
                      >
                        {method}
                      </button>
                    ))}
                  </div>
                  <button
                    onClick={() => setShowCheckoutModal(false)}
                    class="w-full py-2 text-slate-500 hover:text-slate-300 text-sm"
                  >
                    Back to Order
                  </button>
                </div>
              </div>
            )}

            {/* Print View / Receipt Preview */}
            {lastReceipt && (
              <div class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
                <div class="bg-white text-black p-6 rounded-2xl max-w-sm w-full font-mono text-xs space-y-3 shadow-2xl">
                  <div class="text-center space-y-1">
                    <h2 class="text-base font-bold">KAPAMPANGAN BISTRO</h2>
                    <p class="text-[10px]">NON-VAT REGISTERED</p>
                    <p class="text-[10px]">TIN: 000-123-456-000</p>
                  </div>
                  <div class="text-left border-t border-b border-dashed py-2 space-y-0.5 text-[11px]">
                    <div>Date/Time: {lastReceipt.date}</div>
                    <div>Receipt No / OR: {lastReceipt.orNo}</div>
                    <div>POS Terminal #: 01</div>
                  </div>
                  <div class="space-y-1">
                    {lastReceipt.items.map((it, idx) => (
                      <div key={idx} class="flex justify-between">
                        <span>{it.qty}x {it.name} {it.discountType ? `(-20% ${it.discountType})` : ""}</span>
                        <span>₱{(it.price * it.qty).toFixed(2)}</span>
                      </div>
                    ))}
                  </div>
                  <div class="border-t border-dashed pt-2 space-y-1">
                    <div class="flex justify-between">
                      <span>Gross Sales</span>
                      <span>₱{lastReceipt.grossSales.toFixed(2)}</span>
                    </div>
                    {lastReceipt.discountTotal > 0 && (
                      <div class="flex justify-between">
                        <span>Discount</span>
                        <span>-₱{lastReceipt.discountTotal.toFixed(2)}</span>
                      </div>
                    )}
                    <div class="flex justify-between">
                      <span>VAT Exempt Sales</span>
                      <span>₱{lastReceipt.vatExemptSales.toFixed(2)}</span>
                    </div>
                    <div class="flex justify-between font-bold text-sm pt-1 border-t">
                      <span>Total Due</span>
                      <span>₱{lastReceipt.totalDue.toFixed(2)}</span>
                    </div>
                  </div>
                  <div class="pt-1">
                    <p class="font-bold">Payment Method: {lastReceipt.method}</p>
                  </div>
                  {lastReceipt.items.some(i => i.discountType) && (
                    <div class="pt-2 border-t text-[10px] space-y-0.5">
                      <p class="font-bold">DISCOUNT DETAILS:</p>
                      {lastReceipt.items.filter(i => i.discountType).map((it, idx) => (
                        <p key={idx}>{it.discountType} | Name: {it.idHolderName || 'N/A'} | ID: {it.idNumber || 'N/A'}</p>
                      ))}
                    </div>
                  )}
                  <div class="text-center pt-3 text-[9px] text-gray-500 border-t border-dashed">
                    <p>THIS DOCUMENT IS NOT VALID</p>
                    <p>FOR CLAIM OF INPUT TAX</p>
                  </div>
                  <button
                    onClick={() => setLastReceipt(null)}
                    class="w-full mt-4 bg-black text-white py-3 rounded-lg font-sans font-bold text-xs"
                  >
                    Close & Start New Order
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<MainPOS />);
    </script>
  </body>
</html>
